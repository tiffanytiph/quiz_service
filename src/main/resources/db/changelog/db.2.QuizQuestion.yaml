databaseChangeLog:
  - changeSet:
      id: create-table-quiz-questions
      author: Tiffany
      changes:
        - createTable:
            tableName: quiz_questions
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
              - column:
                  name: quiz_id
                  type: UUID
                  constraints:
                    foreignKeyName: fk_quiz_questions_quiz
                    references:
                      tableName: quiz
                      columnNames: id
              - column:
                  name: question_id
                  type: UUID