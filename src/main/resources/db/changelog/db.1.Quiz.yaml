databaseChangeLog:
  - changeSet:
      id: create-table-quiz
      author: Tiffany
      changes:
        - createTable:
            tableName: quiz
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
              - column:
                  name: title
                  type: VARCHAR
              - column:
                  name: category
                  type: VARCHAR